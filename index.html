<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description"
        content="Aplikasi edukasi lingkungan interaktif berbasis WebAR untuk anak-anak. Belajar pilah sampah dengan cara yang menyenangkan!" />
    <meta name="theme-color" content="#3a8c4e" />
    <title>EcoKids AR - Belajar Lingkungan Seru!</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@500;600;700;800&display=swap"
        rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        nunito: ['Nunito', 'sans-serif'],
                        baloo: ['Baloo 2', 'cursive'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/game.css" />
    <link rel="stylesheet" href="css/materi.css" />
    <link rel="stylesheet" href="css/ar.css" />
    <link rel="stylesheet" href="css/profil.css" />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- ResponsiveVoice — natural Indonesian teacher voice -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE"></script>
</head>

<body>
    <div id="app">

        <div id="screen-home" class="screen"></div>

        <div id="screen-materi" class="screen"></div>

        <div id="screen-ar" class="screen"></div>

        <div id="screen-detail" class="screen">
            <div id="detail-content"></div>
        </div>

        <div id="screen-game" class="screen"></div>

        <div id="screen-profil" class="screen"></div>

    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden" role="alert" aria-live="polite"></div>
    <!-- Flash -->
    <div id="capture-flash" class="capture-flash hidden"></div>

    <script src="js/app.js?v=2"></script>
    <script src="js/game.js?v=2"></script>
    <script src="js/ar.js"></script>
    <script src="js/materi.js"></script>
    <script src="js/profil.js"></script>
</body>

</html>
